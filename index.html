<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yeti Stream — Global Embedder</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131a2a;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --border: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text);
    }

    header h1 span {
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent-glow);
    }

    header p {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-top: 0.4rem;
    }

    .box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .field {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.8rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      background: var(--accent);
      color: #090d16;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .player-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 1rem;
    }

    .player-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    textarea {
      width: 100%;
      height: 100px;
      background: var(--bg);
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      font-family: monospace;
      font-size: 0.85rem;
      resize: none;
      margin-top: 0.5rem;
    }

    .copy-btn {
      margin-top: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--border);
      color: var(--text);
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .copy-btn:hover {
      background: var(--accent);
      color: #090d16;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🏔️ <span>Yeti Stream</span> Relay</h1>
      <p>Bypass regional blocks & generate playable YouTube embed code</p>
    </header>

    <div class="box">
      <div class="field">
        <label for="videoUrl">Paste Restricted YouTube URL or Embed Link:</label>
        <input 
          type="text" 
          id="videoUrl" 
          placeholder="https://www.youtube.com/embed/mbzEkUWQNw0?si=Q3rVDVShZ_E671x5" 
          value="https://www.youtube.com/embed/mbzEkUWQNw0?si=Q3rVDVShZ_E671x5"
        >
      </div>
      <button class="btn" onclick="processStream()">Generate & Load Unblocked Video</button>
    </div>

    <div id="outputBox" class="box hidden">
      <label>Video Stream Preview</label>
      <div class="player-container">
        <iframe id="streamFrame" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>

      <div style="margin-top: 1.5rem;">
        <label for="embedOutput">Copy Global Embed Code For Your Website:</label>
        <textarea id="embedOutput" readonly></textarea>
        <button class="copy-btn" onclick="copyCode()">Copy Code</button>
      </div>
    </div>
  </div>

  <script>
    function parseID(url) {
      const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function processStream() {
      const url = document.getElementById('videoUrl').value.trim();
      const videoId = parseID(url);

      if (!videoId) {
        alert("Please enter a valid YouTube Video URL.");
        return;
      }

      // Route stream via dedicated global unblocked stream gateway
      const proxyEmbedUrl = `https://iv.melmac.space/embed/${videoId}?autoplay=1`;

      // Load preview frame
      document.getElementById('streamFrame').src = proxyEmbedUrl;

      // Generate Clean Embed Code
      const embedCode = `<iframe \n  width="100%" \n  height="450" \n  src="${proxyEmbedUrl}" \n  title="Yeti Live Stream" \n  frameborder="0" \n  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" \n  allowfullscreen>\n</iframe>`;

      document.getElementById('embedOutput').value = embedCode;
      document.getElementById('outputBox').classList.remove('hidden');
    }

    function copyCode() {
      const codeArea = document.getElementById('embedOutput');
      codeArea.select();
      navigator.clipboard.writeText(codeArea.value);
      alert('Embed code copied!');
    }
  </script>
</body>
</html>
